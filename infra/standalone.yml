# Local Midnight standalone stack for automated tests only (never deployed).
# Mirrors midnight-did/packages/api/standalone.yml with fixed host ports.
services:
  proof-server:
    container_name: licensed-proof-server
    image: '${PROOF_SERVER_IMAGE:-midnightntwrk/proof-server:8.0.3}'
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'

  indexer:
    container_name: licensed-indexer
    image: '${INDEXER_IMAGE:-midnightntwrk/indexer-standalone:4.0.1}'
    env_file: standalone.env
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    container_name: licensed-node
    image: '${NODE_IMAGE:-midnightntwrk/midnight-node:0.22.2}'
    ports:
      - '9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
